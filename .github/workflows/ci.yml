name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev --python ${{ matrix.python-version }}

      # Many more random markets than a local run, since a property test is
      # only as strong as the number of examples it gets to try.
      - name: Run tests
        run: uv run --no-sync pytest -v --hypothesis-profile=ci

  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint (ruff)
            command: uv run --no-sync ruff check --output-format=github .
          - name: Format (black)
            command: uv run --no-sync black --check --diff .
          - name: Imports (isort)
            command: uv run --no-sync isort --check-only --diff .
          - name: Type check (mypy)
            command: uv run --no-sync mypy
          - name: Lockfile is current
            command: uv lock --check
          - name: Package
            command: >-
              uv build --force-pep517 --no-sources &&
              uv build --force-pep517 --wheel --no-sources
              --out-dir dist/from-sdist dist/*.tar.gz &&
              cmp dist/*.whl dist/from-sdist/*.whl &&
              uv venv --python 3.13 dist/verify-venv &&
              uv pip install --python dist/verify-venv/bin/python dist/*.whl &&
              dist/verify-venv/bin/python -I -c
              "from find_eq import find_equilibrium; assert find_equilibrium([2], [1]).quantity == 1"

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}
